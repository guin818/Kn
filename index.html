<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>온라인 파이썬 뷰어</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- CodeMirror CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    <!-- CodeMirror JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
    <!-- Pyodide (WebAssembly Python) -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
    <style>
        .CodeMirror {
            height: 400px;
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
            font-size: 14px;
            border-radius: 0.5rem;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-md">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-teal-400 flex items-center gap-2">
                온라인 파이썬 뷰어
            </h1>
            <div id="status" class="text-xs bg-amber-500/20 text-amber-400 px-3 py-1 rounded-full border border-amber-500/30">
                Pyodide core 로딩 중...
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 grid grid-cols-1 lg:grid-cols-2 gap-4">
        
        <!-- Left Side: Editor & Actions -->
        <div class="flex flex-col gap-4">
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-sm flex flex-col gap-3">
                <div class="flex justify-between items-center">
                    <label class="text-sm font-semibold text-slate-300">파이썬 소스 코드</label>
                    <div class="flex gap-2">
                        <button id="btn-clear" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded transition">비우기</button>
                    </div>
                </div>
                
                <!-- CodeMirror Container -->
                <textarea id="code-editor">
</textarea>
                
                <button id="btn-run" disabled class="w-full bg-teal-600 hover:bg-teal-500 disabled:bg-slate-700 disabled:text-slate-500 text-white font-bold py-3 px-4 rounded-lg transition shadow-md cursor-not-allowed">
                    Pyodide 초기화 중...
                </button>
            </div>
        </div>

        <!-- Right Side: Console Output -->
        <div class="flex flex-col gap-4">
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-sm flex flex-col h-full">
                <div class="flex justify-between items-center mb-3">
                    <label class="text-sm font-semibold text-slate-300">실행 결과 (콘솔)</label>
                    <button id="btn-clear-output" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded transition">결과 지우기</button>
                </div>
                <div id="output" class="flex-1 bg-slate-950 p-4 rounded-lg font-mono text-sm overflow-y-auto text-emerald-400 border border-slate-900 whitespace-pre-wrap min-h-[350px] lg:min-h-[385px]"></div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-950 border-t border-slate-800 p-4 text-center text-xs text-slate-500">
        <p>브라우저 내부(WebAssembly)에서 모든 코드가 안전하게 실행됩니다. 서버로 코드가 전송되지 않습니다.</p>
    </footer>

    <!-- Script Application Logics -->
    <script>
        let pyodideInstance = null;
        let editor = null;

        // UI 요소
        const statusEl = document.getElementById('status');
        const runBtn = document.getElementById('btn-run');
        const outputEl = document.getElementById('output');
        const clearBtn = document.getElementById('btn-clear');
        const clearOutputBtn = document.getElementById('btn-clear-output');

        // CodeMirror 초기화
        window.addEventListener('DOMContentLoaded', () => {
            editor = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
                mode: 'python',
                theme: 'dracula',
                lineNumbers: true,
                indentUnit: 4,
                tabSize: 4,
                lineWrapping: true
            });
            
            // Pyodide 엔진 로드
            initPyodide();
        });

        // Pyodide 초기화 함수
        async function initPyodide() {
            try {
                pyodideInstance = await loadPyodide();
                
                // 상태 업데이트
                statusEl.textContent = '준비 완료 (WebAssembly)';
                statusEl.classList.remove('bg-amber-500/20', 'text-amber-400', 'border-amber-500/30');
                statusEl.classList.add('bg-emerald-500/20', 'text-emerald-400', 'border-emerald-500/30');
                
                // 실행 버튼 활성화
                runBtn.disabled = false;
                runBtn.textContent = '▶ 코드 실행하기';
                runBtn.classList.remove('cursor-not-allowed');
            } catch (err) {
                statusEl.textContent = '초기화 실패';
                statusEl.classList.remove('bg-amber-500/20', 'text-amber-400', 'border-amber-500/30');
                statusEl.classList.add('bg-rose-500/20', 'text-rose-400', 'border-rose-500/30');
                outputEl.textContent = 'Pyodide 컴포넌트를 로드하지 못했습니다: ' + err.message;
            }
        }

        // 파이썬 표준 출력을 캡처하여 화면에 표시하는 함수
        function appendOutput(text, isError = false) {
            const span = document.createElement('span');
            span.textContent = text;
            if (isError) {
                span.classList.add('text-rose-400');
            } else {
                span.classList.add('text-emerald-400');
            }
            outputEl.appendChild(span);
            outputEl.scrollTop = outputEl.scrollHeight;
        }

        // 실행 버튼 클릭 이벤트
        runBtn.addEventListener('click', async () => {
            if (!pyodideInstance) return;

            // 콘솔 초기화
            outputEl.innerHTML = '';
            
            // 코드 가져오기
            const code = editor.getValue();
            
            // 표준 출력(stdout) 리디렉션을 위한 패치 설정
            pyodideInstance.setStdout({
                write: (buffer) => {
                    appendOutput(new TextDecoder().decode(buffer));
                    return buffer.length;
                }
            });
            
            pyodideInstance.setStderr({
                write: (buffer) => {
                    appendOutput(new TextDecoder().decode(buffer), true);
                    return buffer.length;
                }
            });

            try {
                // 파이썬 코드 비동기 실행
                await pyodideInstance.runPythonAsync(code);
            } catch (err) {
                // 파이썬 실행 에러 덤프
                appendOutput('\n[실행 에러]\n' + err.message, true);
            }
        });

        // 에디터 비우기
        clearBtn.addEventListener('click', () => {
             {
                editor.setValue('');
                editor.focus();
            }
        });

        // 결과창 비우기
        clearOutputBtn.addEventListener('click', () => {
            outputEl.innerHTML = '';
        });
    </script>
</body>
</html>
